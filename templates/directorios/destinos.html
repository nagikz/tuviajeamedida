{% extends 'base.html' %}
{% block content %}
<h2>Listado General de Destinos</h2>
<ul>
    {% for destino in destinos %}
    <li>
        <a href="{{ url_for('destino_detalle', destino_id=destino.id) }}">
            <strong>{{ destino.nombre }}</strong> ({{ destino.pais }})
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
